name: zavero
description: "ZAVERO - Professional Restoran va Kafe POS SaaS Tizimi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend bilan aloqa (Firebase o'rniga)
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2

  # Util paketlar
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Rasmlar va media fayllar papkasi:
  assets:
    - assets/logo/
    - assets/images/
    - assets/data/
    - assets/audio/
    # Yoki aniq bitta PNG faylni ko'rsatmoqchi bo'lsangiz:
    # - assets/images/logo.png