<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ZAVERO - Professional Restoran va Kafe Savdo Tizimi (POS SaaS)">
  <meta name="theme-color" content="#0F172A">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZAVERO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Zavero Pos</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #app-loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-logo {
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      animation: pulse 2s infinite ease-in-out;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFA000;
      margin-bottom: 6px;
    }

    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 160, 0, 0.2);
      border-top: 3px solid #FFA000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }
  </style>
</head>

<body>
  <!-- Telegram Web App Integration & Auto-expansion -->
  <script>
    (function () {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          if (window.Telegram.WebApp.disableVerticalSwipes) {
            window.Telegram.WebApp.disableVerticalSwipes();
          }
          if (window.Telegram.WebApp.enableClosingConfirmation) {
            window.Telegram.WebApp.enableClosingConfirmation();
          }
          if (window.Telegram.WebApp.setHeaderColor) {
            window.Telegram.WebApp.setHeaderColor('#0F172A');
          }
          if (window.Telegram.WebApp.setBackgroundColor) {
            window.Telegram.WebApp.setBackgroundColor('#0F172A');
          }
        } catch (e) {
          console.warn('Telegram WebApp setup error:', e);
        }
      }
    })();
  </script>

  <!-- Initial Fast Loading Splash -->
  <div id="app-loading-container">
    <img src="favicon.png" alt="Zavero POS" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-title">ZAVERO POS</div>
    <div class="loading-subtitle">Tizim yuklanmoqda...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('app-loading-container');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(hideLoader, 6000);
  </script>

  <!-- Force clear old service workers and storage caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      }).catch(function(){});
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var n of names) { caches.delete(n); }
      }).catch(function(){});
    }
  </script>

  <script src="mac_touch_id.js"></script>
  <script src="sound_effects.js"></script>
  <script src="flutter_bootstrap.js?v=20261029_v101" async></script>
</body>

</html>
