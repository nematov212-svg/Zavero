  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #app-loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-logo {
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      animation: pulse 2s infinite ease-in-out;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFA000;
      margin-bottom: 6px;
    }

    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 160, 0, 0.2);
      border-top: 3px solid #FFA000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }
  </style>
</head>

<body>
  <!-- Telegram Web App Integration & Auto-expansion -->
  <script>
    (function () {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          var tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();

          var canCall = function (version) {
            return tg.isVersionAtLeast ? tg.isVersionAtLeast(version) : false;
          };

          if (canCall('7.7') && tg.disableVerticalSwipes) {
            try { tg.disableVerticalSwipes(); } catch (_) {}
          }
          if (canCall('6.2') && tg.enableClosingConfirmation) {
            try { tg.enableClosingConfirmation(); } catch (_) {}
          }
          if (canCall('6.1') && tg.setHeaderColor) {
            try { tg.setHeaderColor('#0F172A'); } catch (_) {}
          }
          if (canCall('6.1') && tg.setBackgroundColor) {
            try { tg.setBackgroundColor('#0F172A'); } catch (_) {}
          }

          // Telegram BackButton support: ofitsiant yoki foydalanuvchi sahifalarida to'g'ri ishlashi
          if (canCall('6.1') && tg.BackButton) {
            var updateBackButton = function () {
              var h = window.location.hash || '';
              if (h && h !== '#/' && h !== '#dashboard' && h !== '') {
                try { tg.BackButton.show(); } catch (_) {}
              } else {
                try { tg.BackButton.hide(); } catch (_) {}
              }
            };
            tg.BackButton.onClick(function () {
              if (window.location.hash && window.location.hash !== '#/' && window.location.hash !== '#dashboard') {
                window.history.back();
              } else {
                try { tg.BackButton.hide(); } catch (_) {}
              }
            });
            window.addEventListener('hashchange', updateBackButton);
            updateBackButton();
          }
        } catch (e) {
          console.warn('Telegram WebApp setup error:', e);
        }
      }
    })();
  </script>

  <!-- Initial Fast Loading Splash -->
  <div id="app-loading-container">
    <img src="favicon.png" alt="Zavero POS" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-title">ZAVERO POS</div>
    <div class="loading-subtitle">Tizim yuklanmoqda...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    var _zaveroLoaderRemoved = false;
    function hideLoader() {
      if (_zaveroLoaderRemoved) return;
      var loader = document.getElementById('app-loading-container');
      if (!loader) {
        _zaveroLoaderRemoved = true;
        return;
      }
      try {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      } catch (_) {}
      setTimeout(function () {
        if (_zaveroLoaderRemoved) return;
        _zaveroLoaderRemoved = true;
        try {
          if (loader && loader.remove) {
            loader.remove();
          } else if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        } catch (_) {}
      }, 400);
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(hideLoader, 6000);
  </script>

  <!-- Force clear old service workers and storage caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var r of regs) { r.unregister(); }
      }).catch(function () { });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (var n of names) { caches.delete(n); }
      }).catch(function () { });
    }
  </script>

  <!-- Yashirin <iframe> orqali 80mm termo chekni chop etish va modalda ko'rish (blob: URLsiz, ERR_BLOCKED_BY_CLIENT ni to'liq oldini oladi) -->
  <script>
    window.zaveroPrintReceiptHtml = function (htmlContent) {
      return new Promise(function (resolve) {
        try {
          var old = document.getElementById('zavero-receipt-iframe');
          if (old) {
            try {
              if (old.remove) old.remove();
              else if (old.parentNode) old.parentNode.removeChild(old);
            } catch (_) {}
          }
          var iframe = document.createElement('iframe');
          iframe.id = 'zavero-receipt-iframe';
          iframe.style.position = 'fixed';
          iframe.style.left = '0';
          iframe.style.top = '0';
          iframe.style.width = '0';
          iframe.style.height = '0';
          iframe.style.border = '0';
          iframe.style.visibility = 'hidden';
          iframe.style.zIndex = '-9999';
          document.body.appendChild(iframe);

          var doc = iframe.contentWindow.document;
          doc.open();
          doc.write(htmlContent);
          doc.close();

          var cleaned = false;
          var cleanup = function () {
            if (cleaned) return;
            cleaned = true;
            setTimeout(function () {
              try {
                if (iframe) {
                  if (iframe.remove) iframe.remove();
                  else if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                }
              } catch (_) { }
            }, 1500);
          };

          try {
            iframe.contentWindow.addEventListener('afterprint', cleanup);
          } catch (_) { }

          var doPrint = function () {
            try {
              var container = doc.querySelector('.receipt-container') || doc.querySelector('.kitchen-container') || doc.body;
              var images = doc.images || [];
              var pending = images.length;

              var executePrint = function () {
                try {
                  // 96 DPI: 1 inch = 25.4mm = 96px => 1mm = 96 / 25.4 ≈ 3.779527559px
                  var rect = container.getBoundingClientRect();
                  var scrollH = Math.max(container.scrollHeight, container.offsetHeight, rect.height);
                  var heightMm = Math.ceil(scrollH / 3.779527559) + 4; // 3-4mm kesish uchun buffer
                  if (heightMm < 45) heightMm = 45;

                  // Dinamik @page style: Chrome 80mm x aniq balandlik bo'yicha 1 sahifaga sig'diradi
                  var styleEl = doc.createElement('style');
                  styleEl.innerHTML =
                    '@page { size: 80mm ' + heightMm + 'mm !important; margin: 0 !important; }' +
                    'html, body { width: 80mm !important; height: ' + heightMm + 'mm !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; }' +
                    '.receipt-container, .kitchen-container { width: 72mm !important; margin: 0 auto !important; padding-left: 0 !important; padding-right: 0 !important; page-break-after: avoid !important; break-after: avoid !important; page-break-inside: avoid !important; break-inside: avoid !important; }';
                  doc.head.appendChild(styleEl);

                  setTimeout(function () {
                    try {
                      iframe.contentWindow.focus();
                      iframe.contentWindow.print();
                      resolve(true);
                    } catch (e) {
                      console.error('[Zavero] print execution error:', e);
                      cleanup();
                      resolve(false);
                    }
                  }, 120);
                } catch (e) {
                  console.error('[Zavero] measurement error:', e);
                  iframe.contentWindow.focus();
                  iframe.contentWindow.print();
                  resolve(true);
                }
              };

              if (pending === 0) {
                executePrint();
              } else {
                var loaded = 0;
                var onImg = function () {
                  loaded++;
                  if (loaded >= pending) executePrint();
                };
                for (var i = 0; i < images.length; i++) {
                  if (images[i].complete) {
                    loaded++;
                  } else {
                    images[i].onload = onImg;
                    images[i].onerror = onImg;
                  }
                }
                if (loaded >= pending) {
                  executePrint();
                } else {
                  setTimeout(executePrint, 1500);
                }
              }
            } catch (e) {
              console.error('[Zavero] Iframe print setup error:', e);
              cleanup();
              resolve(false);
            }
          };

          if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
            setTimeout(doPrint, 80);
          } else {
            iframe.onload = function () {
              setTimeout(doPrint, 80);
            };
          }

          setTimeout(cleanup, 90000);
        } catch (err) {
          console.error('[Zavero] Setup error:', err);
          resolve(false);
        }
      });
    };

    window.zaveroShowReceiptModal = function (htmlContent) {
      var prev = document.getElementById('zavero-receipt-modal');
      if (prev) {
        try {
          if (prev.remove) prev.remove();
          else if (prev.parentNode) prev.parentNode.removeChild(prev);
        } catch (_) {}
      }

      var backdrop = document.createElement('div');
      backdrop.id = 'zavero-receipt-modal';
      backdrop.style.position = 'fixed';
      backdrop.style.inset = '0';
      backdrop.style.zIndex = '999999';
      backdrop.style.backgroundColor = 'rgba(15, 23, 42, 0.75)';
      backdrop.style.backdropFilter = 'blur(4px)';
      backdrop.style.webkitBackdropFilter = 'blur(4px)';
      backdrop.style.display = 'flex';
      backdrop.style.alignItems = 'center';
      backdrop.style.justifyContent = 'center';
      backdrop.style.padding = '16px';
      backdrop.style.boxSizing = 'border-box';

      var card = document.createElement('div');
      card.style.backgroundColor = '#f8fafc';
      card.style.borderRadius = '16px';
      card.style.width = '100%';
      card.style.maxWidth = '420px';
      card.style.maxHeight = '92vh';
      card.style.display = 'flex';
      card.style.flexDirection = 'column';
      card.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.35)';
      card.style.overflow = 'hidden';

      var header = document.createElement('div');
      header.style.padding = '14px 18px';
      header.style.backgroundColor = '#0f172a';
      header.style.color = '#ffffff';
      header.style.display = 'flex';
      header.style.alignItems = 'center';
      header.style.justifyContent = 'space-between';
      header.innerHTML = '<div style="font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;"><span>🧾</span><span>Chekni ko‘rish</span></div>' +
        '<button id="zavero-modal-close-icon" style="background:transparent;border:0;color:#94a3b8;font-size:22px;cursor:pointer;padding:0 4px;line-height:1;">&times;</button>';
      card.appendChild(header);

      var body = document.createElement('div');
      body.style.flex = '1';
      body.style.overflowY = 'auto';
      body.style.padding = '16px';
      body.style.display = 'flex';
      body.style.justifyContent = 'center';
      body.style.backgroundColor = '#f1f5f9';

      var iframe = document.createElement('iframe');
      iframe.style.width = '340px';
      iframe.style.minHeight = '520px';
      iframe.style.border = '0';
      iframe.style.borderRadius = '8px';
      iframe.style.backgroundColor = '#ffffff';
      iframe.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1)';
      iframe.srcdoc = htmlContent;

      iframe.onload = function () {
        try {
          var h = iframe.contentWindow.document.body.scrollHeight;
          if (h > 100) iframe.style.height = (h + 20) + 'px';
        } catch (_) { }
      };

      body.appendChild(iframe);
      card.appendChild(body);

      var footer = document.createElement('div');
      footer.style.padding = '12px 18px';
      footer.style.backgroundColor = '#ffffff';
      footer.style.borderTop = '1px solid #e2e8f0';
      footer.style.display = 'flex';
      footer.style.gap = '10px';
      footer.style.justifyContent = 'flex-end';

      var closeBtn = document.createElement('button');
      closeBtn.textContent = 'Yopish';
      closeBtn.style.padding = '10px 18px';
      closeBtn.style.borderRadius = '10px';
      closeBtn.style.border = '1px solid #cbd5e1';
      closeBtn.style.backgroundColor = '#f1f5f9';
      closeBtn.style.color = '#334155';
      closeBtn.style.fontSize = '14px';
      closeBtn.style.fontWeight = '600';
      closeBtn.style.cursor = 'pointer';

      var printBtn = document.createElement('button');
      printBtn.innerHTML = '🖨️ Chop etish';
      printBtn.style.padding = '10px 20px';
      printBtn.style.borderRadius = '10px';
      printBtn.style.border = '0';
      printBtn.style.backgroundColor = '#315efb';
      printBtn.style.color = '#ffffff';
      printBtn.style.fontSize = '14px';
      printBtn.style.fontWeight = '700';
      printBtn.style.cursor = 'pointer';
      printBtn.style.display = 'flex';
      printBtn.style.alignItems = 'center';
      printBtn.style.gap = '6px';

      var closeModal = function () {
        try {
          if (backdrop) {
            if (backdrop.remove) backdrop.remove();
            else if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
          }
        } catch (_) {}
      };

      closeBtn.onclick = closeModal;
      header.querySelector('#zavero-modal-close-icon').onclick = closeModal;
      backdrop.onclick = function (e) {
        if (e.target === backdrop) closeModal();
      };

      printBtn.onclick = function () {
        if (window.zaveroPrintReceiptHtml) {
          window.zaveroPrintReceiptHtml(htmlContent);
        }
      };

      footer.appendChild(closeBtn);
      footer.appendChild(printBtn);
      card.appendChild(footer);

      backdrop.appendChild(card);
      document.body.appendChild(backdrop);
    };
  </script>
