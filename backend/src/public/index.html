<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ZAVERO - Professional Restoran va Kafe Savdo Tizimi (POS SaaS)">
  <meta name="theme-color" content="#0F172A">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZAVERO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZAVERO POS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #app-loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loading-logo {
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFA000;
      margin-bottom: 6px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 160, 0, 0.2);
      border-top: 3px solid #FFA000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <!-- Telegram Web App Integration & Subscription Lock -->
  <script>
    (function() {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          var tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
          if (tg.setHeaderColor) tg.setHeaderColor('#0F172A');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#0F172A');

          // Strict Telegram WebApp Subscription Verification
          if (tg.initData) {
            fetch('/api/auth/telegram-verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ initData: tg.initData })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.verified && !data.hasActiveSubscription) {
                // Subscription is NOT active! Block app access!
                var loader = document.getElementById('app-loading-container');
                if (loader) loader.style.display = 'none';

                var lockScreen = document.createElement('div');
                lockScreen.id = 'zavero-subscription-lock';
                lockScreen.innerHTML = 
                  '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0F172A;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">' +
                    '<div style="width:76px;height:76px;border-radius:22px;background:rgba(239,68,68,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:20px;border:1px solid rgba(239,68,68,0.3);font-size:34px;">🔒</div>' +
                    '<h2 style="margin:0 0 8px;font-size:22px;font-weight:800;color:#F8FAFC;letter-spacing:0.5px;">Obuna faol emas</h2>' +
                    '<p style="margin:0 0 24px;font-size:14px;color:#94A3B8;line-height:1.6;max-width:320px;">' +
                      'ZAVERO POS tizimidan foydalanish uchun 30 kunlik litsenziyani faollashtiring. Agar to‘lov chekini yuborgan bo‘lsangiz, administrator tasdiqlashini kuting.' +
                    '</p>' +
                    '<button onclick="Telegram.WebApp.close()" style="background:#FFA000;color:#0F172A;border:none;border-radius:14px;padding:14px 28px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(255,160,0,0.35);transition:all 0.2s;">' +
                      'Botga qaytish' +
                    '</button>' +
                  '</div>';
                document.body.appendChild(lockScreen);
              }
            })
            .catch(function(err) {
              console.warn('Subscription check error:', err);
            });
          }
        } catch (e) {
          console.warn('Telegram WebApp setup error:', e);
        }
      }
    })();
  </script>

  <!-- Initial Fast Loading Splash -->
  <div id="app-loading-container">
    <img src="favicon.png" alt="Zavero POS" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-title">ZAVERO POS</div>
    <div class="loading-subtitle">Tizim yuklanmoqda...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('app-loading-container');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(hideLoader, 6000);
  </script>

  <script src="mac_touch_id.js"></script>
  <script src="sound_effects.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
