<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zaveroGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="zaveroGlow" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Polygon -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#0E1322" stroke="url(#zaveroGrad)" stroke-width="2" />
  
  <!-- Stylized Z with Restaurant Wave -->
  <path d="M14 15H34L20 33H34" stroke="url(#zaveroGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)" />
  <circle cx="34" cy="15" r="2.5" fill="#10B981" />
  <circle cx="14" cy="33" r="2.5" fill="#06B6D4" />
