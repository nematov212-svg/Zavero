# ==============================================================================
# ZAVERO — PRODUCTION NGINX CONFIGURATION
# Domains:
#   - zavero.uz / www.zavero.uz       -> Marketing Website & Director CRM (React/Vite)
#   - app.zavero.uz                   -> Flutter Web POS & Cafe Management Application
#   - api.zavero.uz (or /api)         -> Express.js / Socket.IO Backend
# ==============================================================================

# Rate Limiting
limit_req_zone $binary_remote_addr zone=zavero_api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=zavero_conn_limit:10m;

# Upstream Backend Pool
upstream zavero_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zavero.uz www.zavero.uz app.zavero.uz api.zavero.uz;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main Domain: https://zavero.uz (React Marketing & Director Panel)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zavero.uz www.zavero.uz;

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zavero.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zavero.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/zavero-website/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Proxy (/api -> Node.js backend)
    location /api/ {
        limit_req zone=zavero_api_limit burst=50 nodelay;
        proxy_pass http://zavero_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Socket.IO WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://zavero_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. Subdomain: https://app.zavero.uz (Flutter Web POS Application)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.zavero.uz;

    ssl_certificate /etc/letsencrypt/live/zavero.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zavero.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Path to Flutter Web release bundle (or backend/src/public)
    root /var/www/zavero-app/public;
    index index.html;

    # Gzip Compression (crucial for Flutter Web main.dart.js and canvaskit.wasm)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm font/woff font/woff2 image/svg+xml;

    # CORS Headers for Web POS & CanvasKit
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Caching for immutable Flutter assets (CanvasKit, Icons, Sound files)
    location ~* \.(wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wav|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache index.html, version.json, flutter_service_worker.js
    location ~* (index\.html|version\.json|flutter_service_worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # API Proxy for Flutter Web POS
    location /api/ {
        limit_req zone=zavero_api_limit burst=50 nodelay;
        proxy_pass http://zavero_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Real-time Orders & Kitchen KDS
    location /socket.io/ {
        proxy_pass http://zavero_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads (Dish photos, Cafe logos)
    location /uploads/ {
        alias /var/www/zavero-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Customer QR Menu Table Shortcut
    location ~* ^/m/([^/]+)/([^/]+)$ {
        return 302 /menu?cafeId=$1&tableNumber=$2;
    }

    # Flutter Web SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
